name: Actions runner diagnostic

on:
  pull_request:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner startup
        shell: bash
        run: |
          echo "runner=ubuntu-latest" | tee runner-diagnostic.txt
          echo "sha=$GITHUB_SHA" | tee -a runner-diagnostic.txt

      - name: Upload diagnostic marker
        uses: actions/upload-artifact@v4
        with:
          name: runner-diagnostic
          path: runner-diagnostic.txt
          if-no-files-found: error
