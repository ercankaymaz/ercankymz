name: Repair branch Windows CAD CAM validation

on:
  pull_request:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cadcam-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.protectNTFS false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore DLL bootstrap artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build-logs,.repair/bootstrap-original,.repair/bootstrap-supplemental | Out-Null

          function Restore-Artifact {
            param(
              [Parameter(Mandatory=$true)][long]$ArtifactId,
              [Parameter(Mandatory=$true)][string]$Destination,
              [Parameter(Mandatory=$true)][bool]$Required
            )

            $zip = Join-Path $env:RUNNER_TEMP "artifact-$ArtifactId.zip"
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$ArtifactId/zip"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }

            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Remove-Item -LiteralPath $zip -Force -ErrorAction Ignore
                Invoke-WebRequest -Uri $uri -Headers $headers -MaximumRedirection 10 -OutFile $zip
                if ((Get-Item -LiteralPath $zip).Length -le 0) { throw 'Downloaded artifact is empty.' }
                Expand-Archive -LiteralPath $zip -DestinationPath $Destination -Force
                "ARTIFACT_RESTORED id=$ArtifactId destination=$Destination attempt=$attempt" | Tee-Object -Append build-logs/bootstrap.txt
                return
              }
              catch {
                "ARTIFACT_RETRY id=$ArtifactId attempt=$attempt error=$($_.Exception.Message)" | Tee-Object -Append build-logs/bootstrap.txt
                if ($attempt -lt 5) { Start-Sleep -Seconds ([Math]::Min(15, $attempt * 3)) }
              }
            }

            if ($Required) { throw "Required bootstrap artifact $ArtifactId could not be restored." }
            "OPTIONAL_ARTIFACT_SKIPPED id=$ArtifactId" | Tee-Object -Append build-logs/bootstrap.txt
          }

          Restore-Artifact -ArtifactId 9002709583 -Destination '.repair/bootstrap-original' -Required $true
          Restore-Artifact -ArtifactId 9081319987 -Destination '.repair/bootstrap-supplemental' -Required $false

      - name: Apply deterministic repair chain
        shell: pwsh
        run: |
          ./.repair/bootstrap-integrity.ps1
          ./.repair/cadcam-repair.ps1
          ./.repair/cam-math-guards.ps1
          ./.repair/ellipse-guards.ps1
          ./.repair/miter-corner-geometry-guards.ps1
          ./.repair/marble-path-guards.ps1
          ./.repair/marble-runtime-guards.ps1
          ./.repair/vacuum-selection-guards.ps1
          ./.repair/marble-path-safety.ps1
          ./.repair/grinding-ui-guards.ps1
          ./.repair/marble-geometry-guards.ps1
          ./.repair/ui-safety-guards.ps1
          ./.repair/marble-form-validation.ps1
          ./.repair/saw-cos-guard.ps1
          ./.repair/grinding-saw-ramp-guards.ps1
          ./.repair/grinding-progress-guards.ps1
          ./.repair/project-normalize.ps1
          ./.repair/source-compat-repair.ps1

      - name: Audit repaired graph
        shell: pwsh
        run: |
          ./.repair/inventory-audit.ps1
          ./.repair/dependency-audit.ps1
          ./.repair/core-dependency-manifest.ps1
          ./.repair/cam-safety-audit.ps1

      - name: Build CAD CAM application graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force build-logs | Out-Null
          $log = 'build-logs/build.txt'
          $candidates = @('Decompiled/CMDMarbleCNC/CMDMarbleCNC.csproj','Decompiled/buCadCamRes/buCadCamRes.csproj')
          $target = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $target) { 'NO_CAD_CAM_ENTRY_PROJECT_FOUND' | Tee-Object $log; exit 1 }
          "BUILD_START $target" | Tee-Object $log
          msbuild $target /restore /m /t:Rebuild /p:Configuration=Release /p:BuildProjectReferences=true /v:minimal 2>&1 | Tee-Object -Append $log
          if ($LASTEXITCODE -ne 0) { "BUILD_FAILED $target" | Tee-Object -Append $log; exit $LASTEXITCODE }
          "BUILD_OK $target" | Tee-Object -Append $log

      - name: Extract build errors
        if: always()
        shell: pwsh
        run: |
          $src = 'build-logs/build.txt'
          $dst = 'build-logs/build-errors.txt'
          if (Test-Path $src) {
            $matches = @(Select-String -Path $src -Pattern 'error\s+(CS|MSB|NETSDK)\d+|fatal error|BUILD_FAILED|NO_CAD_CAM_ENTRY_PROJECT_FOUND' -CaseSensitive:$false)
            "Build error lines: $($matches.Count)" | Tee-Object $dst
            $matches | ForEach-Object { $_.Line } | Select-Object -Unique | Add-Content $dst
          }

      - name: Collect DLL outputs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force final-dll | Out-Null
          $seen = @{}
          Get-ChildItem -Recurse -Filter *.dll -File | Where-Object { $_.FullName -match '\\bin\\Release\\' } | ForEach-Object {
            if (-not $seen.ContainsKey($_.Name)) {
              Copy-Item $_.FullName (Join-Path final-dll $_.Name) -Force
              $seen[$_.Name] = $_.FullName
            }
          }
          "DLL count: $($seen.Count)" | Tee-Object build-logs/dll-count.txt
          $seen.GetEnumerator() | Sort-Object Name | ForEach-Object { "$($_.Name) <= $($_.Value)" } | Add-Content build-logs/dll-count.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-build-logs
          path: build-logs
          if-no-files-found: warn

      - name: Upload DLLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-dll
          path: final-dll
          if-no-files-found: warn
