name: buCadCamRes single DLL build

on:
  push:
    branches: [repair-all-errors]
  pull_request:
    branches: [Test, repair-all-errors]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bucadcamres-single-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bucadcamres:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repaired source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Mono .NET Framework toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel
          if command -v msbuild >/dev/null 2>&1; then
            echo "BUILDER=msbuild" >> "$GITHUB_ENV"
          elif command -v xbuild >/dev/null 2>&1; then
            echo "BUILDER=xbuild" >> "$GITHUB_ENV"
          else
            echo "Mono installation did not provide msbuild or xbuild" >&2
            exit 1
          fi

      - name: Apply deterministic buCadCamRes repair chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./.repair/cadcam-repair.ps1
          ./.repair/cam-math-guards.ps1
          ./.repair/ellipse-guards.ps1
          ./.repair/miter-corner-geometry-guards.ps1
          ./.repair/marble-path-guards.ps1
          ./.repair/marble-runtime-guards.ps1
          ./.repair/marble-input-guards.ps1
          ./.repair/vacuum-selection-guards.ps1
          ./.repair/marble-path-safety.ps1
          ./.repair/five-axis-professional-guards.ps1
          ./.repair/five-axis-gcode-guards.ps1
          ./.repair/grinding-ui-guards.ps1
          ./.repair/grinding-lead-state-guards.ps1
          ./.repair/grinding-closed-guards.ps1
          ./.repair/marble-geometry-guards.ps1
          ./.repair/ui-safety-guards.ps1
          ./.repair/editor-simulation-guards.ps1
          ./.repair/editor-runtime-guards.ps1
          ./.repair/editor-geometry-guards.ps1
          ./.repair/editor-fillet-chamfer-guards.ps1
          ./.repair/tool-form-runtime-guards.ps1
          ./.repair/tool-machine-ui-sync-guards.ps1
          ./.repair/drawing-form-ui-fix.ps1
          ./.repair/marble-form-validation.ps1
          ./.repair/saw-cos-guard.ps1
          ./.repair/grinding-saw-ramp-guards.ps1
          ./.repair/grinding-progress-guards.ps1
          ./.repair/project-normalize.ps1
          ./.repair/source-compat-repair.ps1

      - name: Verify isolated project inputs
        shell: bash
        run: |
          set -euo pipefail
          project='Decompiled/buCadCamRes/buCadCamRes.csproj'
          test -f "$project"
          test -d 'Decompiled/buCadCamRes/lib'
          missing=0
          while IFS= read -r hint; do
            path="Decompiled/buCadCamRes/${hint//\\//}"
            if [ ! -f "$path" ]; then
              echo "Missing HintPath dependency: $path" >&2
              missing=1
            fi
          done < <(sed -n 's:.*<HintPath>\(.*\)</HintPath>.*:\1:p' "$project")
          test "$missing" -eq 0

      - name: Build only buCadCamRes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          project='Decompiled/buCadCamRes/buCadCamRes.csproj'
          "$BUILDER" "$project" \
            /target:Rebuild \
            /property:Configuration=Release \
            /property:Platform=AnyCPU \
            /property:BuildProjectReferences=false \
            /verbosity:minimal 2>&1 | tee build-logs/buCadCamRes-build.log

      - name: Validate DLL
        shell: bash
        run: |
          set -euo pipefail
          dll='Decompiled/buCadCamRes/bin/Release/buCadCamRes.dll'
          test -s "$dll"
          mkdir -p final-bucadcamres
          cp "$dll" final-bucadcamres/
          if [ -f 'Decompiled/buCadCamRes/bin/Release/buCadCamRes.pdb' ]; then
            cp 'Decompiled/buCadCamRes/bin/Release/buCadCamRes.pdb' final-bucadcamres/
          fi
          sha256sum "$dll" | tee final-bucadcamres/SHA256.txt
          file "$dll" | tee final-bucadcamres/FILE_INFO.txt
          printf 'commit=%s\n' "$GITHUB_SHA" > final-bucadcamres/BUILD_COMMIT.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buCadCamRes-single-build-log
          path: build-logs
          if-no-files-found: warn

      - name: Upload buCadCamRes DLL
        uses: actions/upload-artifact@v4
        with:
          name: buCadCamRes-final
          path: final-bucadcamres
          if-no-files-found: error

  export-sourcefinal-toolchain:
    if: github.event_name == 'pull_request' && github.base_ref == 'repair-all-errors'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.423'

      - name: Restore net48 build packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/net48seed
          cat > /tmp/net48seed/net48seed.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net48</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies.net48" Version="1.0.3" PrivateAssets="all" />
              <PackageReference Include="PDFsharp" Version="1.50.5147" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore /tmp/net48seed/net48seed.csproj

      - name: Pack SDK and package cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p EXPORT/nuget
          DOTNET_BIN="$(readlink -f "$(command -v dotnet)")"
          DOTNET_ROOT_DIR="$(dirname "$DOTNET_BIN")"
          tar -I 'xz -T0 -6' -cf EXPORT/dotnet-sdk-linux-x64.tar.xz -C "$DOTNET_ROOT_DIR" .
          for p in microsoft.netframework.referenceassemblies microsoft.netframework.referenceassemblies.net48 pdfsharp; do
            if [ -d "$HOME/.nuget/packages/$p" ]; then
              tar -I 'xz -T0 -6' -cf "EXPORT/nuget/$p.tar.xz" -C "$HOME/.nuget/packages" "$p"
            fi
          done
          sha256sum EXPORT/dotnet-sdk-linux-x64.tar.xz EXPORT/nuget/*.tar.xz > EXPORT/SHA256.txt
          du -h EXPORT/dotnet-sdk-linux-x64.tar.xz EXPORT/nuget/*.tar.xz

      - name: Upload SOURCE_FINAL toolchain
        uses: actions/upload-artifact@v4
        with:
          name: sourcefinal-linux-dotnet-sdk
          path: EXPORT
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
