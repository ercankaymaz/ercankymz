name: Final All Fixes Windows Build

on:
  push:
    branches: [ final-all-fixes-build ]
  pull_request:
    branches: [ Test ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout final repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore original runtime dependencies
        uses: actions/download-artifact@v4
        with:
          name: CMDMarbleCNC-Final-DLLs
          path: .repair/bootstrap-original
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31200670159

      - name: Restore supplemental dependency set
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: final-dll
          path: .repair/bootstrap-supplemental
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31433581668

      - name: Apply cumulative deterministic repair chain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'bootstrap-integrity.ps1',
            'cadcam-repair.ps1',
            'cam-math-guards.ps1',
            'ellipse-guards.ps1',
            'miter-corner-geometry-guards.ps1',
            'marble-path-guards.ps1',
            'marble-runtime-guards.ps1',
            'marble-input-guards.ps1',
            'vacuum-selection-guards.ps1',
            'marble-path-safety.ps1',
            'five-axis-professional-guards.ps1',
            'five-axis-gcode-guards.ps1',
            'grinding-ui-guards.ps1',
            'grinding-lead-state-guards.ps1',
            'grinding-closed-guards.ps1',
            'marble-geometry-guards.ps1',
            'ui-safety-guards.ps1',
            'editor-simulation-guards.ps1',
            'editor-runtime-guards.ps1',
            'editor-geometry-guards.ps1',
            'editor-fillet-chamfer-guards.ps1',
            'tool-form-runtime-guards.ps1',
            'tool-machine-ui-sync-guards.ps1',
            'drawing-form-ui-fix.ps1',
            'marble-form-validation.ps1',
            'saw-cos-guard.ps1',
            'grinding-saw-ramp-guards.ps1',
            'grinding-progress-guards.ps1',
            'project-normalize.ps1',
            'source-compat-repair.ps1'
          )
          New-Item -ItemType Directory -Force build-logs | Out-Null
          foreach ($script in $scripts) {
            $path = Join-Path '.repair' $script
            if (Test-Path -LiteralPath $path) {
              "RUN $script" | Tee-Object -Append build-logs/repair-chain.txt
              & $path 2>&1 | Tee-Object -Append build-logs/repair-chain.txt
              if ($LASTEXITCODE -ne 0) { throw "$script exit=$LASTEXITCODE" }
            } else {
              "SKIP missing optional $script" | Tee-Object -Append build-logs/repair-chain.txt
            }
          }

      - name: Audit source graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($script in @('inventory-audit.ps1','dependency-audit.ps1','core-dependency-manifest.ps1','cam-safety-audit.ps1')) {
            $p = Join-Path '.repair' $script
            if (Test-Path $p) { & $p 2>&1 | Tee-Object -Append build-logs/audit.txt }
          }
          exit 0

      - name: Build CMDMarbleCNC and CAD CAM graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $project = 'Decompiled/CMDMarbleCNC/CMDMarbleCNC.csproj'
          if (-not (Test-Path $project)) { throw "Missing $project" }
          msbuild $project /restore /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:BuildProjectReferences=true /v:minimal 2>&1 | Tee-Object build-logs/build.txt
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build-logs/build.txt -Pattern 'error\s+(CS|MSB|NETSDK)\d+|fatal error' -CaseSensitive:$false | ForEach-Object { $_.Line } | Select-Object -Unique | Set-Content build-logs/build-errors.txt
            exit $LASTEXITCODE
          }

      - name: Collect final EXE and DLL runtime
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force final-runtime | Out-Null
          Get-ChildItem '.repair/bootstrap-original' -Recurse -File | ForEach-Object {
            if ($_.Extension -in @('.dll','.exe','.config')) { Copy-Item $_.FullName (Join-Path final-runtime $_.Name) -Force }
          }
          Get-ChildItem '.repair/bootstrap-supplemental' -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            if ($_.Extension -in @('.dll','.exe','.config')) { Copy-Item $_.FullName (Join-Path final-runtime $_.Name) -Force }
          }
          Get-ChildItem 'Decompiled' -Recurse -File | Where-Object { $_.FullName -match '\\bin\\Release\\' -and $_.Extension -in @('.dll','.exe','.config') } | ForEach-Object {
            Copy-Item $_.FullName (Join-Path final-runtime $_.Name) -Force
          }
          $exe = Get-ChildItem final-runtime -Filter 'CMDMarbleCNC.exe' -File | Select-Object -First 1
          $dll = Get-ChildItem final-runtime -Filter 'buCadCamRes.dll' -File | Select-Object -First 1
          "EXE_FOUND=$([bool]$exe)" | Tee-Object build-logs/final-runtime.txt
          "BUCAD_FOUND=$([bool]$dll)" | Tee-Object -Append build-logs/final-runtime.txt
          "RUNTIME_FILES=$((Get-ChildItem final-runtime -File).Count)" | Tee-Object -Append build-logs/final-runtime.txt
          Get-ChildItem final-runtime -File | Sort-Object Name | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content final-runtime/SHA256.txt

      - name: Upload final runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CMDStoneCAM-FINAL-ALL-FIXES-RUNTIME
          path: final-runtime
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CMDStoneCAM-FINAL-ALL-FIXES-LOGS
          path: build-logs
          if-no-files-found: warn
          retention-days: 14
