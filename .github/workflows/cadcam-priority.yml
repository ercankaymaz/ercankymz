name: CAD CAM core fast validation

on:
  pull_request:
    branches:
      - Test
  workflow_dispatch:

concurrency:
  group: cadcam-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cadcam-core:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.protectNTFS false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Repair recovered sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-logs | Out-Null
          ./.repair/cadcam-repair.ps1
          ./.repair/project-normalize.ps1
          ./.repair/source-compat-repair.ps1

      - name: Audit core dependency manifest
        continue-on-error: true
        shell: pwsh
        run: ./.repair/core-dependency-manifest.ps1

      - name: Build buClass blocker
        shell: pwsh
        run: |
          $log = 'build-logs/buClass-build.txt'
          msbuild 'Decompiled/buClass/buClass.csproj' /restore /m /t:Rebuild /p:Configuration=Release /v:minimal 2>&1 | Tee-Object $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect buClass DLL
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force core-dll | Out-Null
          Get-ChildItem -Recurse -File -Filter buClass.dll | Where-Object { $_.FullName -match '\\bin\\Release\\' } | ForEach-Object { Copy-Item $_.FullName core-dll -Force }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buclass-build-logs
          path: build-logs
          if-no-files-found: warn

      - name: Upload buClass DLL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buclass-dll
          path: core-dll
          if-no-files-found: warn
