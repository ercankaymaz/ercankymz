name: CAD CAM core fast validation

on:
  pull_request:
    branches: [Test]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cadcam-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cadcam-core:
    runs-on: windows-2022
    steps:
      - name: Enable Git long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.protectNTFS false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore DLL bootstrap artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build-logs,.repair/bootstrap-original,.repair/bootstrap-supplemental | Out-Null

          function Restore-Artifact {
            param(
              [Parameter(Mandatory=$true)][long]$ArtifactId,
              [Parameter(Mandatory=$true)][string]$Destination,
              [Parameter(Mandatory=$true)][bool]$Required
            )

            $zip = Join-Path $env:RUNNER_TEMP "artifact-$ArtifactId.zip"
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$ArtifactId/zip"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }

            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Remove-Item -LiteralPath $zip -Force -ErrorAction Ignore
                Invoke-WebRequest -Uri $uri -Headers $headers -MaximumRedirection 10 -OutFile $zip
                if ((Get-Item -LiteralPath $zip).Length -le 0) { throw 'Downloaded artifact is empty.' }
                Expand-Archive -LiteralPath $zip -DestinationPath $Destination -Force
                "ARTIFACT_RESTORED id=$ArtifactId destination=$Destination attempt=$attempt" | Tee-Object -Append build-logs/bootstrap.txt
                return
              }
              catch {
                "ARTIFACT_RETRY id=$ArtifactId attempt=$attempt error=$($_.Exception.Message)" | Tee-Object -Append build-logs/bootstrap.txt
                if ($attempt -lt 5) { Start-Sleep -Seconds ([Math]::Min(15, $attempt * 3)) }
              }
            }

            if ($Required) { throw "Required bootstrap artifact $ArtifactId could not be restored." }
            "OPTIONAL_ARTIFACT_SKIPPED id=$ArtifactId" | Tee-Object -Append build-logs/bootstrap.txt
          }

          Restore-Artifact -ArtifactId 9002709583 -Destination '.repair/bootstrap-original' -Required $true
          Restore-Artifact -ArtifactId 9081319987 -Destination '.repair/bootstrap-supplemental' -Required $false

      - name: Repair recovered sources
        shell: pwsh
        run: |
          ./.repair/bootstrap-integrity.ps1
          ./.repair/cadcam-repair.ps1
          ./.repair/cam-math-guards.ps1
          ./.repair/ellipse-guards.ps1
          ./.repair/miter-corner-geometry-guards.ps1
          ./.repair/marble-path-guards.ps1
          ./.repair/marble-runtime-guards.ps1
          ./.repair/vacuum-selection-guards.ps1
          ./.repair/marble-path-safety.ps1
          ./.repair/grinding-ui-guards.ps1
          ./.repair/marble-geometry-guards.ps1
          ./.repair/ui-safety-guards.ps1
          ./.repair/marble-form-validation.ps1
          ./.repair/saw-cos-guard.ps1
          ./.repair/grinding-saw-ramp-guards.ps1
          ./.repair/grinding-progress-guards.ps1
          ./.repair/project-normalize.ps1
          ./.repair/source-compat-repair.ps1
          ./.repair/core-dependency-manifest.ps1

      - name: Build CAD CAM core chain fail-fast
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force build-logs | Out-Null
          $targets = @(
            @{ Name='CmdLangAPI'; Path='Decompiled/CmdLangAPI/CmdLangAPI.csproj' },
            @{ Name='buClass'; Path='Decompiled/buClass/buClass.csproj' },
            @{ Name='buCore'; Path='Decompiled/buCore/buCore.csproj' },
            @{ Name='buControls'; Path='Decompiled/buControls/buControls.csproj' },
            @{ Name='buEyeBase'; Path='Decompiled/buEyeBase/buEyeBase.csproj' },
            @{ Name='buMW'; Path='Decompiled/buMW/buMW.csproj' },
            @{ Name='buCadCamRes'; Path='Decompiled/buCadCamRes/buCadCamRes.csproj' }
          )
          $summary = 'build-logs/core-build-summary.txt'
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target.Path)) { throw "Missing project $($target.Path)" }
            $log = "build-logs/$($target.Name)-build.txt"
            "BUILD_START $($target.Name)" | Tee-Object -Append $summary
            msbuild $target.Path /restore /m /t:Rebuild /p:Configuration=Release /p:BuildProjectReferences=true /v:minimal 2>&1 | Tee-Object $log
            if ($LASTEXITCODE -ne 0) {
              "BUILD_FAILED $($target.Name) exit=$LASTEXITCODE" | Tee-Object -Append $summary
              Select-String -Path $log -Pattern 'error\s+(CS|MSB|NETSDK)\d+|fatal error' -CaseSensitive:$false | ForEach-Object { $_.Line } | Select-Object -Unique | Select-Object -First 250 | Add-Content $summary
              exit $LASTEXITCODE
            }
            "BUILD_OK $($target.Name)" | Tee-Object -Append $summary
          }

      - name: Collect core DLLs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force core-dll | Out-Null
          foreach ($name in @('CmdLangAPI.dll','buClass.dll','buCore.dll','buControls.dll','buEyeBase.dll','buMW.dll','buCadCamRes.dll')) {
            Get-ChildItem -Recurse -File -Filter $name | Where-Object { $_.FullName -match '\\bin\\Release\\' } | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName core-dll -Force }
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadcam-core-build-logs
          path: build-logs
          if-no-files-found: warn

      - name: Upload core DLLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadcam-core-dll
          path: core-dll
          if-no-files-found: warn
