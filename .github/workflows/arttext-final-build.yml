name: ArtText Helper And Portable Patcher

on:
  push:
    branches: [ arttext-final-build ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated DLL references
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work\old | Out-Null
          gh run download 31200670159 --repo $env:GITHUB_REPOSITORY --name CMDMarbleCNC-Final-DLLs --dir work\old
          if ($LASTEXITCODE -ne 0) { throw "gh run download failed: $LASTEXITCODE" }
          Get-ChildItem work\old -Recurse -Filter *.dll | Select-Object -First 10 FullName,Length

      - name: Build ArtTextHelper for .NET Framework 4.8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work\deps, FINAL_OUTPUT | Out-Null
          Get-ChildItem work\old -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName work\deps -Force }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          $csc = Join-Path $vs 'MSBuild\Current\Bin\Roslyn\csc.exe'
          $fx = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          & $csc /nologo /target:library /langversion:latest /optimize+ /out:FINAL_OUTPUT\ArtTextHelper.dll `
            /r:"$fx\System.dll" /r:"$fx\System.Core.dll" /r:"$fx\System.Drawing.dll" /r:"$fx\System.Windows.Forms.dll" `
            /r:work\deps\buClass.dll /r:work\deps\buControls.dll arttext-final\ArtTextHelper.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path FINAL_OUTPUT\ArtTextHelper.dll)) { throw "ArtTextHelper compile failed: $LASTEXITCODE" }
          $an=[Reflection.AssemblyName]::GetAssemblyName((Resolve-Path FINAL_OUTPUT\ArtTextHelper.dll))
          $sha=(Get-FileHash FINAL_OUTPUT\ArtTextHelper.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "Assembly=$($an.FullName)`nSHA256=$sha" | Set-Content FINAL_OUTPUT\ARTTEXT_HELPER_AUDIT.txt

      - name: Build Linux x64 portable patcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work\patcher | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <RuntimeIdentifier>linux-x64</RuntimeIdentifier>
              <InvariantGlobalization>true</InvariantGlobalization>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Mono.Cecil" Version="0.11.5" />
            </ItemGroup>
          </Project>
          '@ | Set-Content work\patcher\PatchExternal.csproj -Encoding UTF8
          Copy-Item arttext-final\PatchExternal.cs work\patcher\Program.cs -Force
          dotnet publish work\patcher\PatchExternal.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o FINAL_OUTPUT\patcher-linux
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path FINAL_OUTPUT\patcher-linux\PatchExternal)) { throw "patcher publish failed: $LASTEXITCODE" }
          $sha=(Get-FileHash FINAL_OUTPUT\patcher-linux\PatchExternal -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256=$sha" | Set-Content FINAL_OUTPUT\PATCHER_AUDIT.txt

      - name: Upload helper and patcher
        uses: actions/upload-artifact@v4
        with:
          name: ArtText-Helper-And-Patcher
          path: |
            FINAL_OUTPUT/ArtTextHelper.dll
            FINAL_OUTPUT/ARTTEXT_HELPER_AUDIT.txt
            FINAL_OUTPUT/PATCHER_AUDIT.txt
            FINAL_OUTPUT/patcher-linux/PatchExternal
          if-no-files-found: error
          retention-days: 30
